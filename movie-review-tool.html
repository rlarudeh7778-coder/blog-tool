<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영화 리뷰 자동 생성기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:#f8f7f4;color:#1a1a1a;min-height:100vh}
.header{background:#1a1a1a;color:#fff;padding:18px 32px;display:flex;align-items:center;gap:12px}
.header h1{font-size:18px;font-weight:600}
.badge{background:#e8ff6b;color:#1a1a1a;font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px}
.badge2{background:#6bffb8;color:#1a1a1a;font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px}
.container{max-width:860px;margin:0 auto;padding:32px 20px}
.input-section{background:#fff;border-radius:16px;border:1px solid #e8e5de;padding:28px;margin-bottom:24px}
.section-label{font-size:13px;font-weight:600;color:#666;letter-spacing:0.3px;text-transform:uppercase;display:block;margin-bottom:10px}
.input-row{display:flex;gap:12px}
.input-row input{flex:1;height:48px;border:1.5px solid #e8e5de;border-radius:10px;padding:0 16px;font-size:16px;font-family:inherit;background:#fafaf8;transition:border-color .2s}
.input-row input:focus{outline:none;border-color:#1a1a1a;background:#fff}
.input-row input::placeholder{color:#bbb}
.btn-generate{height:48px;padding:0 28px;background:#1a1a1a;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;white-space:nowrap}
.btn-generate:hover{background:#333}
.btn-generate:disabled{background:#ccc;cursor:not-allowed}
.api-row{margin-top:14px}
.api-row label{font-size:12px;color:#999;display:block;margin-bottom:6px}
.api-row input{width:100%;height:40px;border:1.5px solid #e8e5de;border-radius:8px;padding:0 14px;font-size:13px;font-family:'Courier New',monospace;background:#fafaf8;color:#555}
.api-row input:focus{outline:none;border-color:#1a1a1a}
.tip{font-size:13px;color:#999;margin-top:10px;line-height:1.6}
.tip strong{color:#666}
.status-bar{display:none;align-items:center;gap:10px;padding:14px 20px;background:#f0f7ff;border-radius:10px;margin-top:16px;font-size:14px;color:#1a5fa8}
.spinner{width:18px;height:18px;border:2px solid #b3d4f5;border-top-color:#1a5fa8;border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.error-box{background:#fff5f5;border:1px solid #fcc;border-radius:10px;padding:14px 18px;margin-top:14px;font-size:13px;color:#c00;display:none;line-height:1.6;white-space:pre-wrap}
.result-section{display:none}
.result-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.result-header h2{font-size:15px;font-weight:600;color:#666}
.btn-group{display:flex;gap:8px;flex-wrap:wrap}
.btn-copy-html{height:36px;padding:0 16px;border-radius:8px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;background:#1a1a1a;color:#fff;border:none}
.btn-copy-html:hover{background:#333}
.btn-copy-text{height:36px;padding:0 16px;border-radius:8px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;background:#fff;color:#1a1a1a;border:1.5px solid #1a1a1a}
.btn-reset{height:36px;padding:0 16px;border-radius:8px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;background:transparent;color:#666;border:1.5px solid #e8e5de}
.review-preview{background:#fff;border-radius:16px;border:1px solid #e8e5de;padding:32px;font-size:15px;line-height:2.0;color:#222}
.char-count{text-align:right;font-size:12px;color:#999;margin-top:10px}
.char-count span{font-weight:700;color:#1a1a1a}
.toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(20px);background:#1a1a1a;color:#fff;padding:12px 24px;border-radius:100px;font-size:14px;font-weight:500;opacity:0;transition:all .3s;pointer-events:none;z-index:999;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="header">
  <h1>🎬 영화 리뷰 자동 생성기</h1>
  <span class="badge">애드센스 최적화</span>
  <span class="badge2">🔍 실시간 웹검색</span>
</div>

<div class="container">
  <div class="input-section">
    <span class="section-label">영화 제목 입력</span>
    <div class="input-row">
      <input type="text" id="movieInput" placeholder="예: 군체, 범죄도시4, 기생충..."/>
      <button class="btn-generate" id="generateBtn" onclick="generateReview()">글 생성하기</button>
    </div>
    <div class="api-row">
      <label>🔑 Anthropic API Key (최초 1회 입력, 브라우저에 저장됨)</label>
      <input type="password" id="apiKeyInput" placeholder="sk-ant-api03-..."/>
    </div>
    <div class="tip"><strong>사용법:</strong> API Key 최초 1회 입력 후 저장됩니다. 이후엔 영화 제목만 입력하고 Enter. 웹검색으로 최신 정보를 가져와 2,500자+ 리뷰 생성. 이미지는 직접 추가해 주세요.</div>
    <div class="error-box" id="errorBox"></div>
    <div class="status-bar" id="statusBar">
      <div class="spinner"></div>
      <span id="statusText">영화 정보 검색 중...</span>
    </div>
  </div>

  <div class="result-section" id="resultSection">
    <div class="result-header">
      <h2>생성된 리뷰</h2>
      <div class="btn-group">
        <button class="btn-reset" onclick="resetAll()">다시 생성</button>
        <button class="btn-copy-text" onclick="copyText()">텍스트 복사</button>
        <button class="btn-copy-html" onclick="copyHTML()">📋 HTML 복사 (티스토리용)</button>
      </div>
    </div>
    <div class="review-preview" id="reviewPreview"></div>
    <div class="char-count">글자 수: <span id="charCount">0</span>자</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SYSTEM_PROMPT = `당신은 한국 영화 전문 블로거입니다.
web_search 툴을 사용해서 입력된 영화의 최신 정보를 검색한 뒤, 그 정보를 바탕으로 티스토리 블로그용 영화 리뷰를 JSON 형식으로 작성하세요.

[검색 지침]
- 반드시 web_search 툴로 영화 정보를 먼저 검색하세요
- 검색어 예시: "영화제목 개봉일 감독 출연진 줄거리", "영화제목 결말 리뷰"
- 검색 결과에서 개봉일, 감독, 출연진, 줄거리, 관객수, OTT 정보를 수집하세요
- 정보가 불확실한 경우 "확인 필요" 또는 "미정"으로 표기

[필수 작성 조건]
- 친근한 구어체 (예: ~입니다, ~했어요, ~인데요)
- **, ##, *, _ 같은 마크다운 기호 절대 사용 금지
- 개인 감상과 해석 반드시 포함
- 줄거리 700자 이상, 결말 500자 이상, 전체 2500자 이상
- 반드시 완결된 문장으로 끝낼 것. 내용을 줄여서라도 총평과 별점까지 완성할 것

[출력 형식] 검색 완료 후 반드시 아래 JSON만 출력. 다른 텍스트 없이.

{
  "title": "영화제목 줄거리 결말 총정리 | 배우명 출연 장르 영화 리뷰",
  "intro": "도입부. 200자 이상. 이 영화를 선택한 이유, 분위기 소개.",
  "info": [
    {"label": "개봉일", "value": ""},
    {"label": "장르", "value": ""},
    {"label": "감독", "value": ""},
    {"label": "주연", "value": ""},
    {"label": "러닝타임", "value": ""},
    {"label": "관람등급", "value": ""},
    {"label": "누적관객", "value": ""},
    {"label": "OTT", "value": ""}
  ],
  "recommend": [
    "추천 유형 1 구체적 묘사",
    "추천 유형 2 구체적 묘사",
    "추천 유형 3 구체적 묘사"
  ],
  "story": "줄거리. 700자 이상. 개인 감상 포함. 문단 구분은 \\n\\n 사용.",
  "points": [
    {"label": "연기력", "text": "연기 분석"},
    {"label": "연출·영상미", "text": "연출 분석"},
    {"label": "음악·분위기", "text": "음악 분석"}
  ],
  "spoiler": "결말. 500자 이상. 상세 서술 + 해석 + 주관. 문단 구분은 \\n\\n 사용.",
  "rating_stars": "★★★★☆",
  "rating_text": "한 줄 총평",
  "ott_text": "OTT 플랫폼 정보 자연스럽게 포함한 2~3문장"
}`;

window.addEventListener('DOMContentLoaded', () => {
  const saved = localStorage.getItem('anthropic_api_key');
  if (saved) document.getElementById('apiKeyInput').value = saved;
});

let generatedHTML = '';
let generatedText = '';

function buildInlineHTML(r) {
  const storyParas = (r.story||'').split(/\n\n+/).filter(Boolean)
    .map(p=>`<p style="margin:0 0 16px 0;font-size:16px;line-height:2.0;color:#333;">${p}</p>`).join('');
  const spoilerParas = (r.spoiler||'').split(/\n\n+/).filter(Boolean)
    .map(p=>`<p style="margin:0 0 14px 0;font-size:15px;line-height:2.0;color:#ddd;">${p}</p>`).join('');
  const infoRows = (r.info||[]).map((item,i)=>{
    const bg = i%2===0?'#ffffff':'#f9f8f5';
    return `<tr><td style="padding:11px 16px;font-size:14px;font-weight:600;color:#555;background:${bg};border-bottom:1px solid #f0ede6;width:110px;">${item.label}</td><td style="padding:11px 16px;font-size:14px;color:#333;background:${bg};border-bottom:1px solid #f0ede6;">${item.value}</td></tr>`;
  }).join('');
  const recommendItems = (r.recommend||[]).map((item,i)=>
    `<div style="display:flex;align-items:flex-start;gap:12px;padding:14px 18px;background:#fafaf8;border-radius:10px;border:1px solid #f0ede6;margin-bottom:10px;"><span style="min-width:26px;height:26px;background:#1a1a1a;color:#fff;border-radius:50%;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;">${i+1}</span><span style="font-size:15px;line-height:1.8;color:#333;">${item}</span></div>`
  ).join('');
  const pointItems = (r.points||[]).map(p=>
    `<div style="padding:18px 20px;border-radius:10px;border:1px solid #e8e5de;margin-bottom:12px;background:#fff;"><span style="display:inline-block;background:#1a1a1a;color:#fff;font-size:12px;font-weight:700;letter-spacing:0.5px;padding:3px 12px;border-radius:20px;margin-bottom:10px;">${p.label}</span><p style="margin:0;font-size:15px;line-height:1.9;color:#333;">${p.text}</p></div>`
  ).join('');

  return `<div style="font-family:'Noto Sans KR',sans-serif;max-width:800px;margin:0 auto;color:#1a1a1a;word-break:keep-all;">

<h1 style="font-size:22px;font-weight:700;line-height:1.5;color:#111;margin:0 0 24px 0;padding-bottom:18px;border-bottom:2px solid #1a1a1a;">${r.title||''}</h1>

<div style="font-size:16px;line-height:2.1;color:#333;margin-bottom:36px;padding:22px 24px;background:#f9f8f5;border-radius:12px;border-left:4px solid #1a1a1a;">${r.intro||''}</div>

<div style="margin-bottom:36px;">
<div style="font-size:17px;font-weight:700;color:#111;margin-bottom:16px;padding:13px 18px;background:#f2f0eb;border-radius:10px;border-left:4px solid #1a1a1a;">📋 영화 기본 정보 한눈에 보기</div>
<table style="width:100%;border-collapse:collapse;font-size:14px;"><thead><tr><th colspan="2" style="background:#1a1a1a;color:#fff;padding:11px 16px;text-align:left;font-size:13px;font-weight:600;">영화 정보</th></tr></thead><tbody>${infoRows}</tbody></table>
</div>

<div style="margin-bottom:36px;">
<div style="font-size:17px;font-weight:700;color:#111;margin-bottom:16px;padding:13px 18px;background:#f2f0eb;border-radius:10px;border-left:4px solid #1a1a1a;">✅ 이런 분께 강력 추천드립니다</div>
${recommendItems}
</div>

<div style="margin-bottom:36px;">
<div style="font-size:17px;font-weight:700;color:#111;margin-bottom:16px;padding:13px 18px;background:#f2f0eb;border-radius:10px;border-left:4px solid #1a1a1a;">🎬 줄거리 — 어떤 이야기인가요?</div>
<div style="font-size:16px;line-height:2.0;color:#333;">${storyParas}</div>
</div>

<div style="margin-bottom:36px;">
<div style="font-size:17px;font-weight:700;color:#111;margin-bottom:16px;padding:13px 18px;background:#f2f0eb;border-radius:10px;border-left:4px solid #1a1a1a;">🔍 이것만은 꼭 주목하세요 — 관전 포인트 3가지</div>
${pointItems}
</div>

<div style="margin-bottom:36px;">
<div style="font-size:17px;font-weight:700;color:#111;margin-bottom:16px;padding:13px 18px;background:#f2f0eb;border-radius:10px;border-left:4px solid #1a1a1a;">🔚 결말 리뷰 — 마지막 장면이 남긴 것들</div>
<div style="background:#1a1a1a;border-radius:12px;padding:26px 28px;">
<span style="display:block;font-size:12px;font-weight:700;letter-spacing:1.5px;color:#e8ff6b;margin-bottom:16px;">⚠ SPOILER ALERT — 결말 포함</span>
${spoilerParas}
</div>
</div>

<div style="background:#f9f8f5;border-radius:14px;border:1px solid #e8e5de;padding:28px;text-align:center;">
<div style="font-size:30px;letter-spacing:6px;color:#f5a623;margin-bottom:12px;">${r.rating_stars||'★★★★☆'}</div>
<div style="font-size:17px;font-weight:700;color:#111;margin-bottom:10px;">${r.rating_text||''}</div>
<div style="font-size:14px;color:#888;line-height:1.9;">${r.ott_text||''}</div>
</div>

</div>`;
}

async function generateReview() {
  const movieTitle = document.getElementById('movieInput').value.trim();
  const apiKey = document.getElementById('apiKeyInput').value.trim();
  const errorBox = document.getElementById('errorBox');
  errorBox.style.display = 'none';

  if (!movieTitle) { showError('영화 제목을 입력해주세요.'); return; }
  if (!apiKey) { showError('Anthropic API Key를 입력해주세요.'); return; }
  localStorage.setItem('anthropic_api_key', apiKey);

  const btn = document.getElementById('generateBtn');
  const statusBar = document.getElementById('statusBar');
  const statusText = document.getElementById('statusText');
  const resultSection = document.getElementById('resultSection');

  btn.disabled = true;
  statusBar.style.display = 'flex';
  resultSection.style.display = 'none';

  const steps = [
    '웹에서 최신 영화 정보 검색 중...',
    '개봉일·출연진·줄거리 수집 중...',
    '리뷰 초안 작성 중...',
    'SEO 최적화 적용 중...',
    '최종 글 다듬는 중...'
  ];
  let si = 0;
  const timer = setInterval(()=>{ si=(si+1)%steps.length; statusText.textContent=steps[si]; }, 2500);

  try {
    // 1차 요청 — 웹검색 포함
    const res1 = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 8000,
        system: SYSTEM_PROMPT,
        tools: [{ type: "web_search_20250305", name: "web_search" }],
        messages: [{ role: 'user', content: `영화 제목: ${movieTitle}\n\n이 영화의 최신 정보를 웹에서 검색하고 블로그 리뷰를 JSON으로 작성해주세요.` }]
      })
    });

    const data1 = await res1.json();

    if (data1.error) {
      clearInterval(timer);
      showError('API 오류: ' + (data1.error.message || JSON.stringify(data1.error)));
      statusBar.style.display = 'none';
      btn.disabled = false;
      return;
    }

    let finalText = '';

    // 웹검색 tool_use 처리
    if (data1.stop_reason === 'tool_use') {
      statusText.textContent = '검색 결과 분석 중...';
      const toolBlocks = data1.content.filter(b => b.type === 'tool_use');
      const toolResults = toolBlocks.map(tb => ({
        type: 'tool_result',
        tool_use_id: tb.id,
        content: '검색 완료. 수집한 정보를 바탕으로 JSON 리뷰를 작성해주세요.'
      }));

      const res2 = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify({
          model: 'claude-sonnet-4-6',
          max_tokens: 8000,
          system: SYSTEM_PROMPT,
          tools: [{ type: "web_search_20250305", name: "web_search" }],
          messages: [
            { role: 'user', content: `영화 제목: ${movieTitle}\n\n이 영화의 최신 정보를 웹에서 검색하고 블로그 리뷰를 JSON으로 작성해주세요.` },
            { role: 'assistant', content: data1.content },
            { role: 'user', content: toolResults }
          ]
        })
      });

      const data2 = await res2.json();
      if (data2.content) {
        const tb = data2.content.find(b => b.type === 'text');
        if (tb) finalText = tb.text;
      }
    } else if (data1.content) {
      const tb = data1.content.find(b => b.type === 'text');
      if (tb) finalText = tb.text;
    }

    clearInterval(timer);

    if (!finalText) {
      showError('응답을 받지 못했습니다. 다시 시도해주세요.');
      statusBar.style.display = 'none';
      btn.disabled = false;
      return;
    }

    // JSON 파싱
    let raw = finalText.trim().replace(/^```json\s*/,'').replace(/^```\s*/,'').replace(/\s*```$/,'');
    const jsonMatch = raw.match(/\{[\s\S]*\}/);
    if (jsonMatch) raw = jsonMatch[0];

    try {
      const review = JSON.parse(raw);
      generatedHTML = buildInlineHTML(review);
      generatedText = buildPlainText(review);
      document.getElementById('reviewPreview').innerHTML = generatedHTML;
      document.getElementById('charCount').textContent = generatedText.replace(/\s/g,'').length.toLocaleString();
      resultSection.style.display = 'block';
      resultSection.scrollIntoView({ behavior:'smooth', block:'start' });
    } catch(e) {
      showError('파싱 오류. 다시 시도해주세요.\n원문: ' + raw.slice(0,400));
    }

  } catch(err) {
    clearInterval(timer);
    showError('네트워크 오류: ' + err.message);
  }

  statusBar.style.display = 'none';
  btn.disabled = false;
}

function buildPlainText(r) {
  return [
    r.title, '',
    r.intro, '',
    '[ 영화 기본 정보 ]',
    ...(r.info||[]).map(i=>`${i.label}: ${i.value}`), '',
    '[ 이런 분께 추천 ]',
    ...(r.recommend||[]).map((item,i)=>`${i+1}. ${item}`), '',
    '[ 줄거리 ]', r.story, '',
    '[ 관전 포인트 ]',
    ...(r.points||[]).map(p=>`${p.label}: ${p.text}`), '',
    '⚠ 스포일러 결말', r.spoiler, '',
    `총평: ${r.rating_text}`,
    `별점: ${r.rating_stars}`,
    r.ott_text
  ].join('\n');
}

function copyHTML() {
  navigator.clipboard.writeText(generatedHTML).then(()=>showToast('HTML 복사 완료 ✓  티스토리 HTML 탭에 붙여넣기 하세요'));
}
function copyText() {
  navigator.clipboard.writeText(generatedText).then(()=>showToast('텍스트 복사 완료 ✓'));
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 3000);
}
function showError(msg) {
  const box = document.getElementById('errorBox');
  box.textContent = '⚠️ ' + msg;
  box.style.display = 'block';
}
function resetAll() {
  document.getElementById('resultSection').style.display = 'none';
  document.getElementById('movieInput').value = '';
  document.getElementById('errorBox').style.display = 'none';
  generatedHTML = ''; generatedText = '';
  document.getElementById('movieInput').focus();
}
document.getElementById('movieInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') generateReview();
});
</script>
</body>
</html>
