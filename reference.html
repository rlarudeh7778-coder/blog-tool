<style>

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--txt);font-size:14px;line-height:1.6;min-height:100vh}
a{color:inherit}
/* 헤더 */
header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:var(--sur);border-bottom:1px solid var(--bor);position:sticky;top:0;z-index:30}
.logo{font-size:16px;font-weight:800;display:flex;align-items:center;gap:6px}
.logo span{color:var(--green)}
.hright{display:flex;gap:8px;align-items:center}
.hlink{font-size:12px;color:var(--t2);text-decoration:none;padding:7px 12px;border:1px solid var(--bor);border-radius:var(--rs);background:var(--sur);transition:.15s;white-space:nowrap}

.hero h1{font-size:26px;font-weight:800;letter-spacing:-.5px}
.hero p{color:var(--t2);margin-top:8px;font-size:14px}
.searchbar{display:flex;align-items:center;gap:8px;background:var(--sur);border:2px solid var(--bor);border-radius:999px;padding:6px 6px 6px 18px;margin-top:22px;box-shadow:0 4px 18px rgba(27,143,94,.06);transition:border-color .15s}
.searchbar:focus-within{border-color:var(--green)}
.searchbar input{flex:1;border:0;outline:0;font-size:15px;font-family:inherit;background:transparent;color:var(--txt)}
.searchbar .sicon{color:var(--t3);font-size:17px}
.sbtn{border:0;background:var(--green);color:#fff;font-family:inherit;font-weight:700;font-size:14px;padding:11px 24px;border-radius:999px;cursor:pointer;transition:background .15s;white-space:nowrap}
.sbtn:hover{background:var(--gd)}
/* 필터 */
.filters{max-width:1180px;margin:18px auto 0;padding:0 20px;display:flex;flex-wrap:wrap;gap:18px 26px;align-items:flex-end}
.fgroup{display:flex;flex-direction:column;gap:7px}
.flabel{font-size:11px;font-weight:700;color:var(--t3);letter-spacing:.3px;padding-left:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;font-weight:500;padding:7px 13px;border:1px solid var(--bor);border-radius:999px;background:var(--sur);cursor:pointer;transition:.12s;color:var(--t2);user-select:none}
.chip:hover{border-color:var(--green);color:var(--gd)}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
select{font-family:inherit;font-size:13px;padding:8px 30px 8px 12px;border:1px solid var(--bor);border-radius:var(--rs);background:var(--sur) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='%238aaa9e' stroke-width='1.6' fill='none' stroke-linecap='round'/></svg>") no-repeat right 11px center;appearance:none;color:var(--txt);cursor:pointer}
select:focus{outline:0;border-color:var(--green)}
/* 결과 바 */
.resbar{max-width:1180px;margin:24px auto 0;padding:0 20px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.rescount{font-size:13px;color:var(--t2)}
.rescount b{color:var(--txt)}
.resbar .reset{font-size:12px;color:var(--t3);background:0;border:0;cursor:pointer;text-decoration:underline;font-family:inherit}
.resbar .reset:hover{color:var(--red)}

.card{background:var(--sur);border:1px solid var(--bor);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column}

.thumb{position:relative;aspect-ratio:4/5;background:var(--gl);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.mt-badge{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.62);color:#fff;font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;backdrop-filter:blur(2px);display:flex;align-items:center;gap:3px}
.src-badge{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;background:rgba(255,255,255,.92)}
.cbody{padding:11px 12px 13px}

.cmeta .tagp{margin-left:auto;font-size:11px;color:var(--gd);background:var(--gl);padding:2px 8px;border-radius:6px;font-weight:700}
.empty{grid-column:1/-1;text-align:center;padding:70px 20px;color:var(--t3)}
.empty .ei{font-size:44px;margin-bottom:10px}
.foot{max-width:1180px;margin:0 auto;padding:0 20px 50px;text-align:center;color:var(--t3);font-size:11.5px;line-height:1.8}
.demo-note{background:#fff8e8;border:1px solid #f0e0b8;color:#8a6d2f;font-size:12px;max-width:1180px;margin:18px auto 0;padding:10px 14px;border-radius:var(--rs);display:flex;gap:8px;align-items:center}

.mbg.on{display:flex}
.detail{background:var(--sur);border-radius:16px;overflow:hidden;max-width:760px;width:100%;max-height:90vh;display:grid;grid-template-columns:1fr 1fr}
.detail .dimg{background:#000;aspect-ratio:4/5}
.detail .dimg img{width:100%;height:100%;object-fit:cover}
.detail .dside{padding:22px;display:flex;flex-direction:column;overflow:auto}
.detail .dclose{position:absolute;top:16px;right:18px;background:rgba(0,0,0,.5);color:#fff;border:0;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:15px;z-index:2}
.detail h3{font-size:16px;margin-bottom:4px}
.dstats{display:flex;gap:16px;margin:12px 0;font-size:13px;color:var(--t2);font-weight:600}
.dcap{font-size:13px;color:var(--txt);line-height:1.7;white-space:pre-wrap;flex:1}
.dgo{margin-top:16px;display:block;text-align:center;background:var(--green);color:#fff;text-decoration:none;font-weight:700;padding:12px;border-radius:var(--rs);transition:.15s}

 {id:30, tag:"운동/헬스", source:"youtube", media:"VIDEO", likes:15600, comments:880, daysAgo:6, caption:"3개월 -10kg 다이어트 식단 공개 🥦 굶지 않고 뺀 진짜 식단표."}
];

/* 미디어 타입 표기 */
var MEDIA_LABEL={IMAGE:"🖼 이미지",CAROUSEL:"🎞 캐러셀",VIDEO:"▶ 영상"};
var SRC_ICON={instagram:"📷",youtube:"▶️",tiktok:"🎵",reddit:"👽"};
function srcIcon(s){return SRC_ICON[s]||"🔗";}
function thumbUrl(it){return it.thumbnail?it.thumbnail:("https://picsum.photos/seed/ref"+it.id+"/480/600");}
function fmt(n){return n>=10000?(n/10000).toFixed(1).replace(/\.0$/,'')+"만":n>=1000?(n/1000).toFixed(1).replace(/\.0$/,'')+"천":""+n;}

/* ===== 상태 ===== */
var selectedTags=new Set();

/* 태그 칩 렌더 */
function buildTags(){
  var box=document.getElementById('tagchips');
  box.innerHTML='';
  TAGS.forEach(function(t){
    var c=document.createElement('div');
    c.className='chip';c.textContent=t;
    c.onclick=function(){ if(selectedTags.has(t)){selectedTags.delete(t);c.classList.remove('on');} else {selectedTags.add(t);c.classList.add('on');} render(); };
    box.appendChild(c);
  });
}

/* 필터 변경 시 자동 렌더 */
['source','media','likes','sort'].forEach(function(id){document.getElementById(id).addEventListener('change',render);});
document.getElementById('q').addEventListener('input',debounce(render,180));
document.getElementById('q').addEventListener('keydown',function(e){if(e.key==='Enter')render();});
function debounce(fn,ms){var t;return function(){clearTimeout(t);t=setTimeout(fn,ms);};}

/* ===== 메인 렌더 ===== */
function render(){
  var q=document.getElementById('q').value.trim().toLowerCase();
  var src=document.getElementById('source').value;
  var media=document.getElementById('media').value;
  var minLikes=parseInt(document.getElementById('likes').value,10);
  var sort=document.getElementById('sort').value;

  var rows=DATA.filter(function(it){
    if(q && it.caption.toLowerCase().indexOf(q)<0 && it.tag.toLowerCase().indexOf(q)<0) return false;
    if(selectedTags.size && !selectedTags.has(it.tag)) return false;
    if(src && it.source!==src) return false;
    if(media && it.media!==media) return false;
    if(it.likes<minLikes) return false;
    return true;
  });

  rows.sort(function(a,b){
    if(sort==='likes') return b.likes-a.likes;
    if(sort==='comments') return b.comments-a.comments;
    return a._days-b._days; /* recent */
  });

  document.getElementById('cnt').textContent=rows.length;
  var grid=document.getElementById('grid');

  if(!rows.length){
    grid.innerHTML='<div class="empty"><div class="ei">🔍</div>조건에 맞는 레퍼런스가 없어요.<br>키워드나 필터를 바꿔보세요.</div>';
    return;
  }

  grid.innerHTML=rows.map(function(it){
    return '<div class="card" onclick="openDetail('+it.id+')">'+
      '<div class="thumb">'+
        '<img loading="lazy" src="'+thumbUrl(it)+'" alt=""/>'+
        '<div class="mt-badge">'+MEDIA_LABEL[it.media]+'</div>'+
        '<div class="src-badge">'+srcIcon(it.source)+'</div>'+
      '</div>'+
      '<div class="cbody">'+
        '<div class="ccap">'+escapeHtml(it.caption)+'</div>'+
        '<div class="cmeta"><span>❤ '+fmt(it.likes)+'</span><span>💬 '+fmt(it.comments)+'</span><span class="tagp">#'+it.tag+'</span></div>'+
      '</div>'+
    '</div>';
  }).join('');
}

function escapeHtml(s){return s.replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

/* ===== 상세 모달 ===== */
function openDetail(id){
  var it=DATA.find(function(x){return x.id===id;});if(!it)return;
  document.getElementById('d-img').src=thumbUrl(it);
  document.getElementById('d-src').textContent=srcIcon(it.source)+' '+it.source+' · '+MEDIA_LABEL[it.media].replace(/^.\s?/,'')+' · '+it._days+'일 전';
  document.getElementById('d-tag').textContent='#'+it.tag;
  document.getElementById('d-likes').textContent='❤ 좋아요 '+it.likes.toLocaleString();
  document.getElementById('d-comments').textContent='💬 댓글 '+it.comments.toLocaleString();
  document.getElementById('d-cap').textContent=it.caption;
  document.getElementById('d-go').href=it.url||('https://www.'+(it.source==='instagram'?'instagram.com':it.source==='youtube'?'youtube.com':'tiktok.com'));
  document.getElementById('mbg').classList.add('on');
}
function closeDetail(){document.getElementById('mbg').classList.remove('on');}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeDetail();});

/* 초기화 */
function resetAll(){
  document.getElementById('q').value='';
  document.getElementById('source').value='';
  document.getElementById('media').value='';
  document.getElementById('likes').value='0';
  document.getElementById('sort').value='likes';
  selectedTags.clear();
  document.querySelectorAll('#tagchips .chip').forEach(function(c){c.classList.remove('on');});
  render();
}

/* ===== 데이터 로드 (data.json) ===== */
function normalize(items){
  var now=Date.now();
  items.forEach(function(it){
    if(typeof it.daysAgo==='number'){ it._days=it.daysAgo; }
    else if(it.date){ it._days=Math.max(0,Math.round((now-new Date(it.date).getTime())/86400000)); }
    else { it._days=0; }
  });
  return items;
}
function applyData(j){
  j=j||{};
  TAGS=(j.tags&&j.tags.length)?j.tags:FALLBACK_TAGS;
  DATA=normalize((j.items&&j.items.length)?j.items:FALLBACK_DATA);
  var u=document.getElementById('updated');
  if(u) u.textContent=j._generated?('· 갱신 '+j._generated):'';
  buildTags();
  render();
}
fetch('data.json',{cache:'no-store'})
  .then(function(r){ if(!r.ok) throw 0; return r.json(); })
  .then(function(j){ applyData(j); })
  .catch(function(){ applyData(null); });
</script>
