name: 트렌드 데이터 자동 수집

on:
  schedule:
    # 6시간마다 (KST 04/10/16/22시)
    - cron: "0 1,7,13,19 * * *"
  workflow_dispatch: {}   # 수동 실행 버튼

permissions:
  contents: write          # trends_data.json 커밋/푸시용

concurrency:
  group: collect-trends
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 수집 실행 (표준 라이브러리만 사용, 의존성 없음)
        run: python scripts/collect_trends.py

      - name: 변경분 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          git add trends_data.json
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "자동 수집: 트렌드 데이터 갱신 ($(date -u +'%Y-%m-%d %H:%M'))"
            git push
          fi
