name: 레퍼런스 자동 수집

on:
  schedule:
    # 매일 21:00 UTC = 06:00 KST (한국 새벽). 분/시는 UTC 기준.
    - cron: "0 21 * * *"
  workflow_dispatch: {}   # 깃허브에서 수동 실행 버튼

permissions:
  contents: write          # data.json 커밋/푸시용

concurrency:
  group: collect-references
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r scripts/requirements.txt

      - name: 수집 실행
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/collect.py

      - name: 변경분 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "자동 수집: 레퍼런스 데이터 갱신 ($(date -u +%Y-%m-%d))"
            git push
          fi
