name: 워드프레스 자동 발행

on:
  # 발행 트리거는 외부 스케줄러(cron-job.org)가 매일 09:00 / 21:00 KST에
  # workflow_dispatch API를 호출해 담당한다. GitHub 내장 schedule(cron)은
  # 지연·누락이 잦아(예: 9시간 지연 발행) 발행 시각을 흐트러뜨리므로 제거했다.
  # 필요 시 아래 schedule 블록을 되살려 백업으로 쓸 수 있다(중복방지 가드가 겹침을 막음).
  workflow_dispatch:
    inputs:
      posts_per_run:
        description: "이번 실행에서 발행할 글 수 (비우면 설정값 posts_per_run 사용)"
        required: false
        default: ""
      dry_run:
        description: "1이면 발행 안 하고 미리보기만"
        required: false
        default: ""
      force:
        description: "1이면 중복방지(최소 발행간격) 무시하고 강제 발행 — 수동 복구용"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: wp-autopost
  cancel-in-progress: false

jobs:
  autopost:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v6

      - name: 파이썬 설정
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: 한글 폰트 설치 (썸네일용)
        run: sudo apt-get update && sudo apt-get install -y fonts-nanum

      - name: 의존성 설치
        run: pip install -r scripts/requirements.txt

      - name: 자동 발행 실행
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          # schedule(cron) 실행 시 inputs는 비어 있음('') → 스크립트가 설정값으로 폴백한다.
          POSTS_PER_RUN: ${{ github.event.inputs.posts_per_run }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          FORCE: ${{ github.event.inputs.force }}
        run: python scripts/wp_autopost.py

      - name: 상태/미리보기 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/autopost_state.json scripts/preview 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "자동 발행 상태 갱신 ($(date -u +%Y-%m-%d))"
            git push
          fi
