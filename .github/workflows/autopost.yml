name: 워드프레스 자동 발행

on:
  schedule:
    # KST = UTC+9. 하루 2번, 각 1편씩 발행 (config posts_per_run=1).
    # ※ 정각(00분)은 GitHub Actions 부하가 가장 커 지연·누락이 잦음 → 정각을 피해
    #    20분으로 오프셋해 신뢰도를 높임.
    - cron: "20 0 * * *"   # 00:20 UTC = 오전 09:20 KST
    - cron: "20 12 * * *"  # 12:20 UTC = 오후 09:20 KST
  workflow_dispatch:
    inputs:
      posts_per_run:
        description: "이번 실행에서 발행할 글 수 (비우면 설정값 posts_per_run 사용)"
        required: false
        default: ""
      dry_run:
        description: "1이면 발행 안 하고 미리보기만"
        required: false
        default: ""
      force:
        description: "1이면 중복방지(최소 발행간격) 무시하고 강제 발행 — 수동 복구용"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: wp-autopost
  cancel-in-progress: false

jobs:
  autopost:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v6

      - name: 파이썬 설정
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: 한글 폰트 설치 (썸네일용)
        run: sudo apt-get update && sudo apt-get install -y fonts-nanum

      - name: 의존성 설치
        run: pip install -r scripts/requirements.txt

      - name: 자동 발행 실행
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          # schedule(cron) 실행 시 inputs는 비어 있음('') → 스크립트가 설정값으로 폴백한다.
          POSTS_PER_RUN: ${{ github.event.inputs.posts_per_run }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          FORCE: ${{ github.event.inputs.force }}
        run: python scripts/wp_autopost.py

      - name: 상태/미리보기 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/autopost_state.json scripts/preview 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "자동 발행 상태 갱신 ($(date -u +%Y-%m-%d))"
            git push
          fi
