name: 워드프레스 자동 발행

on:
  schedule:
    # 매일 01:00 UTC = 10:00 KST. (워드프레스는 발행 시간 무관 — 분/시 조정 가능)
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      posts_per_run:
        description: "이번 실행에서 발행할 글 수"
        required: false
        default: "1"
      dry_run:
        description: "1이면 발행 안 하고 미리보기만"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: wp-autopost
  cancel-in-progress: false

jobs:
  autopost:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 한글 폰트 설치 (썸네일용)
        run: sudo apt-get update && sudo apt-get install -y fonts-nanum

      - name: 의존성 설치
        run: pip install -r scripts/requirements.txt

      - name: 자동 발행 실행
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          POSTS_PER_RUN: ${{ github.event.inputs.posts_per_run }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python scripts/wp_autopost.py

      - name: 상태/미리보기 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/autopost_state.json scripts/preview 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "자동 발행 상태 갱신 ($(date -u +%Y-%m-%d))"
            git push
          fi
